# Software for nf-wgs-genotyping (both entry scripts). Used by -profile conda and by the Dockerfile.
# After the first successful solve, export a lock file:
#   mamba env export -n nf-wgs-genotyping > environment.lock.yml
name: nf-wgs-genotyping
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - pysam=0.22
  - pandas=2.2
  - biopython=1.85       # indel_count.py: PairwiseAligner
  - numpy<2
  - pyyaml
  - scipy
  - cytoolz
  - htslib=1.20
  - samtools=1.20
  - bcftools=1.20
  - pytest
  - pytest-runner        # svtyper setup_requires
  - git
  - pip
  - pip:
      # svtyper fork with fragment counts / partner-matched clips, pinned to "Release v0.10.0"
      - "svtyper @ git+https://github.com/marcjwilliams1/svtyper.git@27a042710ddc6c2efa224b6b6cc50b8b45231c0c"
